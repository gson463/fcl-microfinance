# Supabase CLI (https://supabase.com/docs/guides/cli)
# Run: supabase link --project-ref <ref> && supabase db push && supabase functions deploy

[functions.create-admin-user]
verify_jwt = false
# Requires ADMIN_SETUP_SECRET; see docs/SECURITY.md

# JWT is validated inside the function (gateway JWT check can false-negative).
[functions.create-user]
verify_jwt = false

# JWT validated inside function (avoids gateway 401 Invalid JWT).
[functions.update-user]
verify_jwt = false

# JWT validated inside function (avoids gateway 401 when client token is valid but gateway rejects).
[functions.delete-user]
verify_jwt = false

[functions.delete-all-other-users]
verify_jwt = false

# JWT validated inside function; officer_id is always auth.uid(), never from body.
[functions.record-repayment]
verify_jwt = false

[functions.log-audit]
verify_jwt = true

# Validates caller JWT in-function (restricted to designated admin email).
[functions.impersonate-start]
verify_jwt = false
